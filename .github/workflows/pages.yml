name: Deploy demo to GitHub Pages

# Redeploys https://tonycdr-prog.github.io/metal-fx/ whenever the demo changes on main.

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.demo.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build demo
        run: npm run build:demo
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload demo artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist-demo
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v5
