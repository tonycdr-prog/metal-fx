name: Publish to npm

# Publishes the package on every git tag matching v* (e.g. v0.1.0, v1.0.0).
# `--provenance` requires `id-token: write` and a registry-url with HTTPS,
# and produces an attestation linking the tarball to this workflow run.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run release:check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm run check

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run release:check
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - run: npm run build

      - run: npm run package:check

      # Scoped packages default to private visibility, so --access public is
      # explicit. NPM_TOKEN must be a granular token with publish rights and
      # 2FA bypass for @tonycdr-prog/metal-fx.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
