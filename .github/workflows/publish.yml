name: Publish to npm

# Publishes the package on every git tag matching v* (e.g. v0.1.0, v1.0.0).
# `--provenance` requires `id-token: write` and a registry-url with HTTPS,
# and produces an attestation linking the tarball to this workflow run.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run build

      # Publish; --access public is required for unscoped packages on a
      # personal account so the registry knows the package is open. The
      # NPM_TOKEN secret must be a "Granular Access" or "Automation" token
      # created at https://www.npmjs.com/settings/jakubkubo/tokens with
      # publish rights to the metal-fx package.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
