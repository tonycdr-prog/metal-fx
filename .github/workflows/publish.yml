name: Publish immutable GitHub package

# Builds a public package tarball for every reviewed v* tag. Repository-level
# release immutability locks the tag and assets and adds GitHub's release
# attestation when the draft is published.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run release:check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm run check

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run release:check
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - run: npm run build

      - run: npm run package:check

      - name: Pack the approved public artifact
        run: |
          mkdir release
          npm pack --pack-destination release

      - name: Record the artifact checksum
        working-directory: release
        run: sha256sum ./*.tgz > SHA256SUMS

      - name: Publish the immutable release
        run: |
          gh release create "$RELEASE_TAG" release/*.tgz release/SHA256SUMS \
            --draft \
            --generate-notes \
            --title "$RELEASE_TAG" \
            --verify-tag
          gh release edit "$RELEASE_TAG" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Verify the immutable release assets
        run: |
          for asset in release/*.tgz release/SHA256SUMS; do
            gh release verify-asset "$RELEASE_TAG" "$asset"
          done
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
